syntax = "proto3";
package gateway.v1;
option go_package = "gateway-service/proto/gateway/v1";

service GatewayService {
  rpc Chat (ChatRequest) returns (ChatResponse) {}
  rpc ListTools (ListToolsRequest) returns (ListToolsResponse) {}
  rpc ExecuteTool (ToolExecutionRequest) returns (ToolExecutionResponse) {}
  rpc ListMCPTools (ListMCPToolsRequest) returns (ListMCPToolsResponse) {}
}

message ChatRequest {
  repeated Message messages = 1;
}

message Message {
  string role = 1;
  string content = 2;
  repeated string images = 3;
}

message ChatResponse {
  Message message = 1;
}

message ListToolsRequest {}

message Tool {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
}

message ListToolsResponse {
  repeated Tool tools = 1;
  string tools_json = 2;
}

message ToolExecutionRequest {
  string tool_name = 1;
  string input_json = 2;
  string session_id = 3;
}

message ToolExecutionResponse {
  bool success = 1;
  string result_json = 2;
  string error = 3;
  int64 execution_time_ms = 4;
}

message ListMCPToolsRequest {}

message ToolList {
  repeated Tool tools = 1;
}

message ListMCPToolsResponse {
  map<string, ToolList> tools_by_server = 1;
}
